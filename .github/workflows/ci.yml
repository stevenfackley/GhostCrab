name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      actions: write
    uses: stevenfackley/gh-actions/.github/workflows/ci-gradle.yml@v1
    with:
      project-name: GhostCrab
      runs-on: '["ubuntu-latest"]'
      java-version: "17"
      test-task: testDebugUnitTest
      run-lint: true
      run-detekt: true
      extra-gradle-args: --no-configuration-cache
      report-path: app/build/reports
      build-release: true
    secrets: inherit

  mock-gateway:
    # Conformance of the protocol-4 mock gateway against the captured real-gateway frames (ADR-0007).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/mock-gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/mock-gateway/package-lock.json
      - run: npm ci
      - run: npm test
