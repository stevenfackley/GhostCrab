name: iOS PR

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-pr.yml"

permissions:
  contents: read

concurrency:
  group: ios-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-pr:
    name: ios-pr
    # Courtesy guard: skips fork PRs so they don't queue on the self-hosted
    # Mac Mini. The real protection is the repo's fork-PR approval policy
    # (all_external_contributors, set 2026-10-14): no fork workflow runs
    # until a maintainer approves it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Mac Mini self-hosted runner (same label set as ios-release.yml): free minutes.
    # Hosted macOS minutes are what the invoice is.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve Xcode
        run: |
          xcodebuild -version
          xcode-select --print-path

      - name: Install xcodegen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        working-directory: ios
        run: |
          # First iPhone simulator xcodebuild itself lists as an eligible
          # destination for the scheme, so the pick is one the test step accepts.
          # Resolved at runtime: an Xcode upgrade on the runner needs no edit here.
          DESTS=$(xcodebuild -showdestinations -project GhostCrab.xcodeproj -scheme GhostCrab 2>&1 || true)
          LINE=$(printf '%s\n' "$DESTS" \
            | sed -n '/Available destinations/,/Ineligible destinations/p' \
            | grep 'platform:iOS Simulator' | grep 'name:iPhone' \
            | grep -E 'id:[0-9A-Fa-f-]{36}' | head -n 1 || true)
          UDID=$(printf '%s' "$LINE" | sed -nE 's/.*id:([0-9A-Fa-f-]{36}).*/\1/p')
          if [ -z "$UDID" ]; then
            # Fallback: last iPhone listed under the newest iOS runtime in simctl.
            echo "::warning::No iPhone simulator parsed from xcodebuild -showdestinations; falling back to simctl"
            echo "::group::xcodebuild -showdestinations output"
            printf '%s\n' "$DESTS"
            echo "::endgroup::"
            LINE=$(xcrun simctl list devices available | awk '
              /^-- iOS / { ios = 1; next }
              /^-- /     { ios = 0; next }
              ios && /^[[:space:]]+iPhone/ { pick = $0 }
              END { print pick }')
            UDID=$(printf '%s' "$LINE" | sed -nE 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/p')
          fi
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $LINE"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -project GhostCrab.xcodeproj \
            -scheme GhostCrab \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/GhostCrab.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet

      - name: Test summary
        if: always()
        run: |
          XCRESULT="$RUNNER_TEMP/GhostCrab.xcresult"
          [ -d "$XCRESULT" ] || exit 0
          # -quiet hides per-test output; print the counts and any failures.
          xcrun xcresulttool get test-results summary --path "$XCRESULT" --compact || true
          [ "${{ job.status }}" = "success" ] && exit 0
          # Crash reports (app or test runner died before reporting results).
          DIAG="$RUNNER_TEMP/diagnostics"
          xcrun xcresulttool export diagnostics --path "$XCRESULT" --output-path "$DIAG" >/dev/null 2>&1 || true
          find "$DIAG" -type f \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | head -n 3 | while read -r f; do
            echo "::group::$f"
            head -c 8000 "$f"
            echo
            echo "::endgroup::"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-pr-xcresult-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/GhostCrab.xcresult
          if-no-files-found: ignore
          retention-days: 7

  catalyst:
    name: ios-pr-catalyst
    # Same fork guard and runner as ios-pr. With one runner the two jobs queue
    # one after the other; neither waits on the other's result.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install xcodegen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (Mac Catalyst)
        working-directory: ios
        run: |
          # Compile check only: no tests, no signing. ios-release.yml archives the
          # Catalyst slice for TestFlight; this catches iOS-only APIs before then.
          xcodebuild build \
            -project GhostCrab.xcodeproj \
            -scheme GhostCrab \
            -destination "platform=macOS,variant=Mac Catalyst,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-catalyst" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
