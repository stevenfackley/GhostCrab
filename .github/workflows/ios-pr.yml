name: iOS PR

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-pr.yml"

permissions:
  contents: read

concurrency:
  group: ios-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-pr:
    name: ios-pr
    # Mac Mini self-hosted runner (same label set as ios-release.yml): free minutes.
    # Hosted macOS minutes are what the invoice is.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Xcode
        run: |
          xcodebuild -version
          xcode-select --print-path

      - name: Install xcodegen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Last iPhone listed under the newest iOS runtime. Resolved at runtime so
          # an Xcode upgrade on the runner (iPhone 16 -> iPhone 17) needs no edit here.
          LINE=$(xcrun simctl list devices available | awk '
            /^-- iOS / { ios = 1; next }
            /^-- /     { ios = 0; next }
            ios && /^[[:space:]]+iPhone/ { pick = $0 }
            END { print pick }')
          UDID=$(printf '%s' "$LINE" | sed -nE 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/p')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator:$LINE"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios
        run: |
          xcodebuild test \
            -project GhostCrab.xcodeproj \
            -scheme GhostCrab \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/GhostCrab.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet

      - name: Summarise test failures
        if: failure()
        run: |
          XCRESULT="$RUNNER_TEMP/GhostCrab.xcresult"
          [ -d "$XCRESULT" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$XCRESULT" --compact || true
          # Crash reports (app or test runner died before reporting results).
          DIAG="$RUNNER_TEMP/diagnostics"
          xcrun xcresulttool export diagnostics --path "$XCRESULT" --output-path "$DIAG" >/dev/null 2>&1 || true
          find "$DIAG" -type f \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | head -n 3 | while read -r f; do
            echo "::group::$f"
            head -c 8000 "$f"
            echo
            echo "::endgroup::"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-pr-xcresult-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/GhostCrab.xcresult
          if-no-files-found: ignore
          retention-days: 7
