name: iOS + Mac Catalyst Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Override build number (defaults to GitHub run number)"
        required: false
        type: string
      skip_macos:
        description: "Skip Mac Catalyst archive + upload"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      WORKING_DIR: ${{ github.workspace }}/ios
      IOS_ARCHIVE_PATH: ${{ github.workspace }}/ios/build/GhostCrab-iOS.xcarchive
      MAC_ARCHIVE_PATH: ${{ github.workspace }}/ios/build/GhostCrab-macOS.xcarchive
      IOS_EXPORT_PATH: ${{ github.workspace }}/ios/build/export-ios
      MAC_EXPORT_PATH: ${{ github.workspace }}/ios/build/export-macos
      EXPORT_OPTIONS: ${{ github.workspace }}/ios/ExportOptions.plist
      # Identifiers only; scripts read them as shell variables, never as
      # inline expressions. The private key (ASC_KEY_P8) stays scoped to the
      # one step that writes it to disk.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve Xcode
        run: |
          xcodebuild -version
          xcode-select --print-path

      - name: Install xcodegen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ${{ env.WORKING_DIR }}
        run: xcodegen generate

      - name: Resolve build number
        id: build_number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          V="${BUILD_NUMBER_INPUT:-$RUN_NUMBER}"
          # CFBundleVersion: one to three dot-separated integers.
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::build_number must be one to three dot-separated integers (e.g. 42 or 1.2.3)"
            exit 1
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # ── iOS ────────────────────────────────────────────────────────────────

      - name: Archive (iOS)
        working-directory: ${{ env.WORKING_DIR }}
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          xcodebuild \
            -project GhostCrab.xcodeproj \
            -scheme GhostCrab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${IOS_ARCHIVE_PATH}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            archive

      - name: Export IPA (iOS)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${IOS_ARCHIVE_PATH}" \
            -exportPath "${IOS_EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Upload iOS build to TestFlight
        run: |
          xcrun altool --upload-app \
            -f "${IOS_EXPORT_PATH}/GhostCrab.ipa" \
            -t ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      # ── Mac Catalyst ───────────────────────────────────────────────────────

      - name: Archive (Mac Catalyst)
        if: inputs.skip_macos != true
        working-directory: ${{ env.WORKING_DIR }}
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          xcodebuild \
            -project GhostCrab.xcodeproj \
            -scheme GhostCrab \
            -configuration Release \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -archivePath "${MAC_ARCHIVE_PATH}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            archive

      - name: Export PKG (Mac Catalyst)
        if: inputs.skip_macos != true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${MAC_ARCHIVE_PATH}" \
            -exportPath "${MAC_EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Upload Mac Catalyst build to TestFlight
        if: inputs.skip_macos != true
        run: |
          # Mac Catalyst exports as .pkg, not .ipa. altool's -t flag accepts macos.
          PKG_PATH=$(find "${MAC_EXPORT_PATH}" -maxdepth 1 -name '*.pkg' | head -n1)
          if [ -z "$PKG_PATH" ]; then
            echo "::error::No .pkg found in ${MAC_EXPORT_PATH}"
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      # ── Artifacts + cleanup ────────────────────────────────────────────────

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghostcrab-build-${{ steps.build_number.outputs.value }}
          path: |
            ${{ env.IOS_EXPORT_PATH }}/GhostCrab.ipa
            ${{ env.MAC_EXPORT_PATH }}/*.pkg
            ${{ env.IOS_ARCHIVE_PATH }}/dSYMs
            ${{ env.MAC_ARCHIVE_PATH }}/dSYMs
          if-no-files-found: ignore
          retention-days: 14

      - name: Wipe ASC API key
        if: always()
        run: |
          # macOS has no shred(1), so the old `shred -u ... || rm -f ...` only ever
          # reached its rm. On APFS (copy-on-write SSD) an in-place overwrite gives
          # no extra guarantee either, so unlink and verify.
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$KEY_FILE"
          if [ -e "$KEY_FILE" ]; then
            echo "::error::ASC API key still present at $KEY_FILE"
            exit 1
          fi
